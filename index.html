<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal de classe</title>
<style>
:root{
  --ink:#26385f;--muted:#78859b;--line:#e1e7f0;--bg:#f7f9fd;
  --card:#fff;--accent:#7658c7;--pink:#f3dce8;--blue:#e1efff;--yellow:#fff1ba;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#f7f9fd,#faf7ff 55%,#fffaf3);
}
.shell{max-width:1050px;margin:auto;padding:24px 16px 50px}
.hero{
  background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 10px 30px rgba(44,58,94,.08);margin-bottom:18px
}
.hero h1{margin:0 0 6px;font-size:28px}
.hero p{margin:0;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.badge{
  background:#f3efff;color:#5d46a4;border-radius:999px;padding:6px 10px;
  font-size:12px;font-weight:800
}
.card{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;
  box-shadow:0 7px 20px rgba(44,58,94,.05);margin-bottom:11px
}
.date{font-size:13px;font-weight:900;color:#6a52ac;margin-bottom:8px}
.course{font-size:15px;font-weight:900}
.chapter{font-size:12px;color:var(--muted);margin-top:2px}
.type{
  display:inline-block;margin-top:8px;background:#fff5cf;border-radius:999px;
  padding:4px 8px;font-size:10px;font-weight:850;color:#856b14
}
.text{margin-top:10px;line-height:1.5;white-space:pre-wrap}
.state{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;
  text-align:center;color:var(--muted)
}
.state strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.chooser{display:grid;gap:9px;margin-top:12px}
.choice{
  border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;
  cursor:pointer;text-align:left;color:var(--ink)
}
.choice:hover{background:#faf8ff;border-color:#cfc3eb}
.choice strong{display:block}
.choice small{display:block;color:var(--muted);margin-top:3px}
.refresh{
  border:0;background:#7658c7;color:white;border-radius:11px;padding:9px 12px;
  font-weight:800;cursor:pointer;margin-top:12px
}
@media(max-width:650px){
  .shell{padding:12px 10px 35px}.hero{padding:16px}.hero h1{font-size:23px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <h1>📘 Journal de classe</h1>
    <p id="subtitle">Chargement du journal…</p>
    <div class="meta" id="meta"></div>
  </div>
  <main id="app"><div class="state">Chargement…</div></main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://fhsqypzaavllffggxhby.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9hNuHKNf94hOm0lHKOaUag_CE1HLcDv';
const TABLE = 'journaux eleves';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const subtitle = document.getElementById('subtitle');
const meta = document.getElementById('meta');

const esc = v => String(v ?? '')
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'","&#039;");

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + (iso.length===10 ? 'T12:00:00' : ''));
  if(Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('fr-BE',{
    weekday:'long',day:'2-digit',month:'long',year:'numeric'
  });
}

function getCode(){
  return new URLSearchParams(location.search).get('code')?.trim() || '';
}

function renderJournal(row){
  const payload = row?.contenu || {};
  const items = Array.isArray(payload.items) ? [...payload.items] : [];

  subtitle.textContent = `${payload.className || row.classe || 'Classe'}${payload.courseName ? ' — '+payload.courseName : ''}`;
  meta.innerHTML = `
    <span class="badge">🏫 ${esc(payload.className || row.classe || 'Classe')}</span>
    ${payload.courseName ? `<span class="badge">📚 ${esc(payload.courseName)}</span>` : ''}
    ${row.date_publication ? `<span class="badge">🔄 Mis à jour le ${esc(new Date(row.date_publication).toLocaleString('fr-BE'))}</span>` : ''}
  `;

  items.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

  if(!items.length){
    app.innerHTML = `<div class="state"><strong>Aucune entrée publiée</strong>Le journal existe bien, mais il ne contient encore aucune entrée visible pour les élèves.</div>`;
    return;
  }

  app.innerHTML = items.map(it=>`
    <article class="card">
      <div class="date">${esc(fmtDate(it.date))}</div>
      <div class="course">${esc(it.course || payload.courseName || '')}</div>
      ${it.chapter ? `<div class="chapter">${esc(it.chapter)}</div>` : ''}
      ${it.type ? `<span class="type">${esc(it.type)}</span>` : ''}
      ${it.text ? `<div class="text">${esc(it.text)}</div>` : ''}
    </article>
  `).join('');
}

async function loadByCode(code){
  app.innerHTML = `<div class="state">Chargement du journal…</div>`;
  const {data,error} = await db
    .from(TABLE)
    .select('classe,code,date_publication,contenu,actif')
    .eq('code',code)
    .eq('actif',true)
    .limit(1);

  if(error){
    console.error(error);
    app.innerHTML = `<div class="state">
      <strong>Impossible de charger le journal</strong>
      La page GitHub fonctionne, mais Supabase refuse la lecture.<br>
      <small>${esc(error.message || '')}</small>
      <br><button class="refresh" onclick="location.reload()">Réessayer</button>
    </div>`;
    return;
  }

  if(!data?.length){
    subtitle.textContent = 'Journal introuvable';
    meta.innerHTML = '';
    app.innerHTML = `<div class="state">
      <strong>Aucun journal ne correspond à ce lien</strong>
      Le code demandé est : <b>${esc(code)}</b>.<br>
      Il faut republier cette classe depuis Mon Suivi Prof ou vérifier le lien transmis.
    </div>`;
    return;
  }

  renderJournal(data[0]);
}

async function showChooser(){
  subtitle.textContent = 'Choisis ta classe / ton cours';
  meta.innerHTML = '';

  const {data,error} = await db
    .from(TABLE)
    .select('classe,code,date_publication,contenu,actif')
    .eq('actif',true)
    .order('classe',{ascending:true});

  if(error){
    console.error(error);
    app.innerHTML = `<div class="state">
      <strong>Impossible d'afficher les journaux disponibles</strong>
      Supabase refuse actuellement la lecture publique.<br>
      <small>${esc(error.message || '')}</small>
    </div>`;
    return;
  }

  if(!data?.length){
    app.innerHTML = `<div class="state"><strong>Aucun journal publié</strong>Publie d'abord un journal depuis Mon Suivi Prof.</div>`;
    return;
  }

  app.innerHTML = `<div class="chooser">${
    data.map(row=>{
      const p=row.contenu||{};
      return `<button class="choice" data-code="${esc(row.code)}">
        <strong>${esc(p.className || row.classe || 'Classe')}</strong>
        <small>${esc(p.courseName || '')}${row.date_publication ? ' · mis à jour '+esc(new Date(row.date_publication).toLocaleDateString('fr-BE')) : ''}</small>
      </button>`;
    }).join('')
  }</div>`;

  app.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const code=btn.dataset.code;
      const u=new URL(location.href);
      u.searchParams.set('code',code);
      location.href=u.toString();
    });
  });
}

const code=getCode();
if(code) loadByCode(code);
else showChooser();
</script>
</body>
</html>
