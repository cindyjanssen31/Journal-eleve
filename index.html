<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal de classe — Élèves</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#fff8fb;color:#173b73}
.w{max-width:1400px;margin:auto;padding:18px}
.h{background:#fff;border:1px solid #ebe5f4;border-radius:22px;padding:18px 22px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:28px}
.m{color:#7380a0;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid #eee}
.dot{width:10px;height:10px;border-radius:50%}
.week{background:#fff;border:1px solid #ebe5f4;border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:0 6px 20px rgba(67,53,112,.05)}
.week-title{padding:13px 16px;font-weight:800;font-size:16px;background:#faf7ff;border-bottom:1px solid #ebe5f4}
.days{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));min-width:950px}
.day{min-height:190px;border-right:1px solid #eee;padding:0}
.day:last-child{border-right:0}
.day-head{padding:10px 11px;background:#fffafd;border-bottom:1px solid #eee;font-size:13px;font-weight:800;text-transform:capitalize}
.entries{padding:9px}
.entry{padding:10px;border:1px solid #eee6f3;border-left:6px solid #d8dff0;border-radius:12px;margin-bottom:8px;background:#fff}
.entry:last-child{margin-bottom:0}
.entry strong{display:block;font-size:13px;margin-bottom:5px}
.entry .txt{font-size:12px;line-height:1.45;white-space:pre-wrap;color:#334b72}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.kind-course{border-left-color:#6f93d8;background:#f7faff}
.kind-course .badge{background:#e7f0ff;color:#315b9a}
.kind-homework{border-left-color:#9a7bd6;background:#fbf7ff}
.kind-homework .badge{background:#f0e8ff;color:#6c4db3}
.kind-test{border-left-color:#e37ca7;background:#fff7fb}
.kind-test .badge{background:#ffe6f0;color:#b24a77}
.kind-note{border-left-color:#efb55b;background:#fffaf3}
.kind-note .badge{background:#ffefcf;color:#9a6a1a}
.kind-other{border-left-color:#9fb5c8;background:#fbfdff}
.kind-other .badge{background:#edf3f7;color:#556f88}
.empty-day{padding:12px;color:#9aa2b5;font-size:12px;text-align:center}
.scroll{overflow-x:auto}
.noinfo{background:#fff;border:1px solid #ebe5f4;border-radius:22px;padding:20px}
@media(max-width:760px){
  .w{padding:10px}
  h1{font-size:23px}
  .days{grid-template-columns:repeat(5,210px);min-width:1050px}
}
</style>
</head>
<body>
<div class="w">
  <div class="h">
    <h1 id="t">Journal de classe</h1>
    <div id="s" class="m">Chargement…</div>
    <div class="legend">
      <span><i class="dot" style="background:#6f93d8"></i> Cours</span>
      <span><i class="dot" style="background:#9a7bd6"></i> Devoir / leçon</span>
      <span><i class="dot" style="background:#e37ca7"></i> Test / évaluation</span>
      <span><i class="dot" style="background:#efb55b"></i> Remarque / info</span>
    </div>
  </div>
  <div id="c"></div>
</div>

<script>
const U="https://fhsqypzaavllffggxhby.supabase.co";
const K="sb_publishable_9hNuHKNf94hOm0lHKOaUag_CE1HLcDv";
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(str){ if(!str)return null; const d=new Date(str+"T12:00:00"); return isNaN(d)?null:d; }
function mondayOf(date){ const d=new Date(date); const day=d.getDay()||7; d.setDate(d.getDate()-day+1); d.setHours(12,0,0,0); return d; }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekLabel(m){
  const f=new Date(m), l=new Date(m); l.setDate(l.getDate()+4);
  const same=f.getMonth()===l.getMonth() && f.getFullYear()===l.getFullYear();
  if(same) return "Semaine du "+f.getDate()+" au "+l.toLocaleDateString("fr-BE",{day:"numeric",month:"long",year:"numeric"});
  return "Semaine du "+f.toLocaleDateString("fr-BE",{day:"numeric",month:"long"})+" au "+l.toLocaleDateString("fr-BE",{day:"numeric",month:"long",year:"numeric"});
}
const dayNames=["lundi","mardi","mercredi","jeudi","vendredi"];

function detectKind(x){
  const txt=((x.type||"")+" "+(x.text||"")+" "+(x.chapter||"")).toLowerCase();
  if(/test|évaluation|evaluation|controle|contrôle|interro/.test(txt)) return {cls:"kind-test", label:"Test"};
  if(/devoir|leçon|lecon|à faire|a faire|exercice à faire|travail/.test(txt)) return {cls:"kind-homework", label:"Devoir"};
  if(/remarque|note|info|information|communication/.test(txt)) return {cls:"kind-note", label:"Info"};
  if(/cours|chapitre|matière|matiere/.test(txt)) return {cls:"kind-course", label:"Cours"};
  return {cls:"kind-other", label:"Autre"};
}

async function load(){
  const code=new URLSearchParams(location.search).get("code")||"";
  if(!code){ s.textContent="Lien incomplet."; return; }
  try{
    const r=await fetch(
      U+"/rest/v1/journaux%20eleves?select=classe,date_publication,contenu&code=eq."+encodeURIComponent(code)+"&actif=eq.true&order=date_publication.desc&limit=1",
      {headers:{apikey:K,Authorization:"Bearer "+K}}
    );
    const a=await r.json();
    if(!r.ok) throw new Error(a?.message||r.status);
    if(!a.length){ s.textContent="Aucun journal publié."; return; }

    const p=a[0].contenu||{};
    const items=Array.isArray(p.items)?p.items:[];
    t.textContent="Journal de classe — "+(p.className||a[0].classe||"");
    s.textContent=(p.courseName||"")+" · Mis à jour "+new Date(a[0].date_publication).toLocaleString("fr-BE");

    const weeks={};
    items.forEach(x=>{
      const d=localDate(x.date);
      if(!d)return;
      const mon=mondayOf(d);
      const wk=isoDate(mon);
      if(!weeks[wk])weeks[wk]={monday:mon,days:{}};
      const dk=isoDate(d);
      if(!weeks[wk].days[dk])weeks[wk].days[dk]=[];
      weeks[wk].days[dk].push(x);
    });

    const ordered=Object.values(weeks).sort((a,b)=>b.monday-a.monday);

    if(!ordered.length){
      c.innerHTML='<div class="noinfo">Aucune information publiée.</div>';
      return;
    }

    c.innerHTML=ordered.map(w=>{
      const cols=dayNames.map((name,i)=>{
        const d=new Date(w.monday); d.setDate(d.getDate()+i);
        const key=isoDate(d);
        const entries=w.days[key]||[];
        const head=name+" "+d.toLocaleDateString("fr-BE",{day:"numeric",month:"numeric"});
        const body=entries.length
          ? entries.map(x=>{
              const kind=detectKind(x);
              const title=x.chapter||x.type||x.course||"Cours";
              const text=x.text||"";
              return '<div class="entry '+kind.cls+'"><span class="badge">'+esc(kind.label)+'</span><strong>'+esc(title)+'</strong><div class="txt">'+esc(text)+'</div></div>';
            }).join("")
          : '<div class="empty-day">—</div>';
        return '<div class="day"><div class="day-head">'+esc(head)+'</div><div class="entries">'+body+'</div></div>';
      }).join("");
      return '<section class="week"><div class="week-title">'+esc(weekLabel(w.monday))+'</div><div class="scroll"><div class="days">'+cols+'</div></div></section>';
    }).join("");
  }catch(e){
    s.textContent="Impossible de charger le journal.";
    c.innerHTML='<div class="noinfo">'+esc(e.message)+'</div>';
  }
}
load();
</script>
</body>
</html>
